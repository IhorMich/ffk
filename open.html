<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#05060c">
  <title>Matchcard</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#05060c;color:#f7f8ff;font-family:system-ui,-apple-system,sans-serif}
    main{width:min(420px,100%);padding:28px;border:1px solid #292d40;border-radius:24px;background:#111421;text-align:center}
    h1{margin:0 0 10px;font-size:1.7rem}
    p{margin:0 0 20px;color:#b8bdd0;line-height:1.45}
    a{display:block;padding:14px 18px;border-radius:14px;background:#d7ff3f;color:#111500;font-weight:800;text-decoration:none}
    small{display:block;margin-top:16px;color:#858ba3}
  </style>
</head>
<body>
  <main>
    <h1>Matchcard</h1>
    <p id="message">Opening the app…</p>
    <a id="openApp" href="#" hidden>Open Matchcard</a>
    <small id="hint" hidden>If the app did not open, tap the button.</small>
  </main>
  <script>
  (function(){
    const lang = (navigator.language || 'en').toLowerCase();
    const text = lang.startsWith('ru')
      ? {opening:'Открываем приложение…', button:'Открыть Matchcard', hint:'Если приложение не открылось, нажмите кнопку.', bad:'Неверная ссылка-приглашение.'}
      : lang.startsWith('uk')
        ? {opening:'Відкриваємо застосунок…', button:'Відкрити Matchcard', hint:'Якщо застосунок не відкрився, натисніть кнопку.', bad:'Невірне посилання-запрошення.'}
        : {opening:'Opening the app…', button:'Open Matchcard', hint:'If the app did not open, tap the button.', bad:'Invalid invitation link.'};
    const code = new URLSearchParams(location.search).get('code') || '';
    const valid = /^[A-Z0-9]{4,8}$/i.test(code);
    const message = document.getElementById('message');
    const button = document.getElementById('openApp');
    const hint = document.getElementById('hint');
    document.documentElement.lang = lang.slice(0, 2);
    if(!valid){
      message.textContent = text.bad;
      return;
    }
    const deep = 'ffk://parent?code=' + encodeURIComponent(code.toUpperCase());
    message.textContent = text.opening;
    button.textContent = text.button;
    button.href = deep;
    setTimeout(() => {
      button.hidden = false;
      hint.hidden = false;
      hint.textContent = text.hint;
    }, 900);
    location.href = deep;
  })();
  </script>
</body>
</html>
