<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#05060c">
  <title>TEMPO</title>
  <link rel="stylesheet" href="css/app.css?v=1.2.382">
</head>
<body class="gate-page">
  <main class="gate">
    <h1>TEMPO</h1>
    <p id="message">Tap the button to open the invitation in the app.</p>
    <a class="save-btn" id="openApp" href="#">Open TEMPO</a>
    <a class="ghost-btn" id="openWeb" href="#" hidden>Open in browser</a>
    <small id="hint">Android requires a tap before a website can open an app.</small>
  </main>
  <script>
  (function(){
    const lang = (navigator.language || 'en').toLowerCase();
    const text = lang.startsWith('ru')
      ? {opening:'Нажмите кнопку, чтобы открыть приглашение в приложении.', button:'Открыть TEMPO', web:'Открыть в браузере', hint:'Если приложение не установлено — откройте в браузере.', bad:'Неверная ссылка-приглашение.'}
      : lang.startsWith('uk')
        ? {opening:'Натисніть кнопку, щоб відкрити запрошення в застосунку.', button:'Відкрити TEMPO', web:'Відкрити в браузері', hint:'Якщо застосунок не встановлено — відкрийте в браузері.', bad:'Невірне посилання-запрошення.'}
        : {opening:'Tap the button to open the invitation in the app.', button:'Open TEMPO', web:'Open in browser', hint:'If the app is not installed, open the invite in the browser.', bad:'Invalid invitation link.'};
    const params = new URLSearchParams(location.search);
    const code = params.get('code') || '';
    const token = params.get('token') || '';
    const validCode = /^[A-Z0-9]{4,8}$/i.test(code);
    const validToken = /^[A-Z0-9_-]{12,64}$/i.test(token);
    const message = document.getElementById('message');
    const button = document.getElementById('openApp');
    const webBtn = document.getElementById('openWeb');
    const hint = document.getElementById('hint');
    document.documentElement.lang = lang.slice(0, 2);
    if(!validCode && !validToken){
      message.textContent = text.bad;
      return;
    }
    const query = validToken
      ? 'token=' + encodeURIComponent(token)
      : 'code=' + encodeURIComponent(code.toUpperCase());
    const web = new URL('./', location.href);
    web.search = query;
    const deep = 'tempo://parent?' + query;
    const androidIntent = 'intent://parent?' + query
      + '#Intent;scheme=tempo;package=app.tempo;S.browser_fallback_url='
      + encodeURIComponent(web.href)
      + ';end';
    const target = /Android/i.test(navigator.userAgent) ? androidIntent : deep;
    message.textContent = text.opening;
    button.textContent = text.button;
    button.href = target;
    webBtn.hidden = false;
    webBtn.textContent = text.web;
    webBtn.href = web.href;
    hint.textContent = text.hint;
  })();
  </script>
</body>
</html>
